      // Defensive shim: Ensure window.fetch has both a getter and setter
      // Prevents "Cannot set property fetch of #<Window> which has only a getter"
      // when scripts or polyfills attempt assignment in strict mode.
      (function() {
        try {
          var _fetch = window.fetch;
          if (_fetch) {
            var currentFetch = _fetch;
            var descriptor = {
              get: function() { return currentFetch; },
              set: function(val) { currentFetch = val; },
              configurable: true,
              enumerable: true
            };
            try { Object.defineProperty(window, 'fetch', descriptor); } catch (_) {}
            if (typeof Window !== 'undefined' && Window.prototype) {
              try { Object.defineProperty(Window.prototype, 'fetch', descriptor); } catch (_) {}
            }
          }
        } catch (_) {}
      })();
    </script>
